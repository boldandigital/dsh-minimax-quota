name: publish

# A release is a tag. The workflow publishes the version in package.json to
# npm with OIDC, so no long-lived token is stored anywhere.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: The tag has to match the version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "the tag is $tag but package.json says $version"
            exit 1
          fi
      - name: Publish
        run: npm publish
